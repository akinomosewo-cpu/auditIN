name: band_a_audit
description: Band A Power Supply Logger & Audit App for Abuja AEDC customers.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.4
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.7
  injectable: ^2.3.2

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.2

  # Battery & Connectivity
  battery_plus: ^5.0.3
  connectivity_plus: ^5.0.2

  # Background Tasks
  workmanager: ^0.5.2
  flutter_background_service: ^5.0.5

  # Notifications
  flutter_local_notifications: ^16.3.3

  # Location
  geolocator: ^11.0.0
  geocoding: ^3.0.0

  # Charts & Visualization
  fl_chart: ^0.67.0
  syncfusion_flutter_charts: ^24.1.41

  # Maps
  flutter_map: ^6.1.0
  latlong2: ^0.9.0

  # PDF Generation (for complaint letters)
  pdf: ^3.10.8
  printing: ^5.12.0

  # HTTP & API
  dio: ^5.4.3
  retrofit: ^4.1.0

  # Utilities
  intl: ^0.19.0
  uuid: ^4.3.3
  logger: ^2.0.2+1
  dartz: ^0.10.1
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  gap: ^3.0.1
  iconsax: ^0.0.8

  # Permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  injectable_generator: ^2.4.1
  freezed: ^2.5.2
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Regular.ttf
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 700
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
